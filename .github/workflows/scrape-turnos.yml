name: Scrape Farmacias de Turno

on:
  schedule:
    # 06:00 AR = 09:00 UTC (Argentina siempre UTC-3, sin horario de verano)
    - cron: "0 9 * * *"
    # 12:00 AR = 15:00 UTC — segunda pasada por si el colegio actualiza más tarde
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      ciudad:
        description: "Ciudad slug (ej: santa-rosa). Vacío = todas."
        required: false
        type: string
      fecha:
        description: "Fecha YYYY-MM-DD. Vacío = hoy en AR."
        required: false
        type: string

jobs:
  scrape:
    name: Scrape turnos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: scrapers/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: scrapers
        run: pnpm install --frozen-lockfile

      - name: Ejecutar scrapers
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_CIUDAD: ${{ inputs.ciudad || '' }}
          TARGET_FECHA: ${{ inputs.fecha || '' }}
        run: pnpm scrape

      - name: Abrir Issue en caso de fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ALERTA] Scraper de farmacias falló — ${date}`,
              body: [
                `El workflow **${context.workflow}** falló.`,
                ``,
                `**Run:** [Ver logs](${runUrl})`,
                ``,
                `Revisá los logs para identificar qué scraper falló y corregir`,
                `el selector HTML o la URL de la fuente.`,
                ``,
                `Mientras tanto, podés cargar los datos manualmente en`,
                `[Supabase Table Editor](https://supabase.com) → tabla \`farmacias_turno\`.`,
              ].join('\n'),
              labels: ['scraper-failure', 'automated'],
            })
