name: Scrape Farmacias de Turno

on:
  schedule:
    # 06:00 AR = 09:00 UTC (Argentina siempre UTC-3, sin horario de verano)
    - cron: "0 9 * * *"
    # 12:00 AR = 15:00 UTC — segunda pasada por si el colegio actualiza más tarde
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      ciudad:
        description: "Ciudad slug (ej: santa-rosa). Vacío = todas."
        required: false
        type: string
      fecha:
        description: "Fecha YYYY-MM-DD. Vacío = hoy en AR."
        required: false
        type: string

jobs:
  scrape:
    name: Scrape turnos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        working-directory: scrapers
        run: pnpm install --no-frozen-lockfile

      - name: Ejecutar scrapers
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_CIUDAD: ${{ inputs.ciudad || '' }}
          TARGET_FECHA: ${{ inputs.fecha || '' }}
        run: pnpm scrape

      - name: Loguear fallo
        if: failure()
        run: |
          echo "❌ El scraper falló. Revisá los logs del paso anterior."
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
